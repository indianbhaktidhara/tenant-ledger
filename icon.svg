<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242830"/>
      <stop offset="100%" stop-color="#14161a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base App Background with Squircle Shape -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Accent -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="#333842" stroke-width="4"/>

  <!-- Ledger Book / Card -->
  <g filter="url(#shadow)">
    <!-- Ledger Sheet -->
    <rect x="80" y="70" width="352" height="372" rx="20" fill="#fbf9f4" stroke="#dcd6c8" stroke-width="3"/>

    <!-- Brass Header Band -->
    <path d="M 80,90 Q 80,70 100,70 L 412,70 Q 432,70 432,90 L 432,145 L 80,145 Z" fill="url(#goldGrad)"/>

    <!-- Binder Spine Rings on Left -->
    <circle cx="110" cy="190" r="10" fill="#e5dfd3" stroke="#9ca3af" stroke-width="3"/>
    <circle cx="110" cy="256" r="10" fill="#e5dfd3" stroke="#9ca3af" stroke-width="3"/>
    <circle cx="110" cy="322" r="10" fill="#e5dfd3" stroke="#9ca3af" stroke-width="3"/>
    <circle cx="110" cy="388" r="10" fill="#e5dfd3" stroke="#9ca3af" stroke-width="3"/>

    <!-- Red Margin Rule Line -->
    <line x1="145" y1="145" x2="145" y2="442" stroke="#f87171" stroke-width="3" stroke-dasharray="0" opacity="0.6"/>

    <!-- Header Text or Symbol: Rupee and "TENANT LEDGER" -->
    <text x="256" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#ffffff" letter-spacing="3">TENANT LEDGER</text>

    <!-- Ledger Horizontal Lines -->
    <!-- Row 1 -->
    <line x1="145" y1="200" x2="415" y2="200" stroke="#e5dfd3" stroke-width="2"/>
    <rect x="165" y="176" width="110" height="12" rx="4" fill="#475569" opacity="0.8"/>
    <rect x="325" y="174" width="75" height="16" rx="4" fill="#0d9488" opacity="0.9"/>

    <!-- Row 2 -->
    <line x1="145" y1="256" x2="415" y2="256" stroke="#e5dfd3" stroke-width="2"/>
    <rect x="165" y="232" width="130" height="12" rx="4" fill="#64748b" opacity="0.8"/>
    <rect x="335" y="230" width="65" height="16" rx="4" fill="#b45309" opacity="0.9"/>

    <!-- Row 3 -->
    <line x1="145" y1="312" x2="415" y2="312" stroke="#e5dfd3" stroke-width="2"/>
    <rect x="165" y="288" width="95" height="12" rx="4" fill="#64748b" opacity="0.8"/>
    <rect x="320" y="286" width="80" height="16" rx="4" fill="#0d9488" opacity="0.9"/>

    <!-- Row 4 -->
    <line x1="145" y1="368" x2="415" y2="368" stroke="#e5dfd3" stroke-width="2"/>
    <rect x="165" y="344" width="140" height="12" rx="4" fill="#64748b" opacity="0.8"/>
    <rect x="340" y="342" width="60" height="16" rx="4" fill="#0284c7" opacity="0.9"/>

    <!-- Total Footer Highlight -->
    <rect x="150" y="396" width="265" height="32" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="165" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#92400e">TOTAL PAID</text>
    <text x="395" y="418" text-anchor="end" font-family="'IBM Plex Mono', monospace, sans-serif" font-weight="700" font-size="15" fill="#0d9488">₹ 54,200</text>
  </g>
</svg>
